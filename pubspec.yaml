name: esimkrd
description: eSIM KRD — travel eSIM for Kurdistan & Iraq
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  country_flags: ^3.2.0
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.2
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  connectivity_plus: ^7.3.1
  share_plus: ^13.3.0
  firebase_messaging: ^16.6.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  app_links: ^7.2.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/
    - assets/images/kurdistan.png
    - assets/images/fib.png
    - assets/images/card.png
    - assets/images/google.png
    - assets/images/whatsap.png
  fonts:
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic.ttf
        - asset: assets/fonts/NotoKufiArabic-Bold.ttf
          weight: 700
